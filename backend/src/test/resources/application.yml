# Isolated in-memory database for tests that load the Spring context.
# Production and Docker configuration are unchanged.
spring:
  datasource:
    url: jdbc:h2:mem:commerce_security_tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
auth:
  jwt-secret: test-only-secret-not-for-production-1234567890
