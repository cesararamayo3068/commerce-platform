# ============================================================
# commerce-platform — stack completo
# Servicios: PostgreSQL 17, backend Spring Boot, frontend Angular.
# Todos los recursos (containers, volumes, network) son propios
# del proyecto con prefijo "portfolio-commerce".
# ============================================================

name: portfolio-commerce

services:
  postgres:
    image: postgres:17
    container_name: portfolio-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria. Copia .env.example a .env y definila.}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - portfolio-commerce-postgres-data:/var/lib/postgresql/data
    networks:
      - portfolio-commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: portfolio-commerce-backend
    restart: unless-stopped
    environment:
      # Conexion interna a PostgreSQL (misma red del proyecto)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-commerce}
      DB_USER: ${POSTGRES_USER:-portfolio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria. Copia .env.example a .env y definila.}
      # Origenes permitidos para CORS (frontend Angular)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:14200}
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-commerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: portfolio-commerce-frontend
    restart: unless-stopped
    environment:
      # El dev server de Angular escucha en 0.0.0.0:4200 dentro
      # del contenedor; el host lo publica en 14200.
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-14200}:4200"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-commerce-network

volumes:
  portfolio-commerce-postgres-data:
    name: portfolio-commerce-postgres-data

networks:
  portfolio-commerce-network:
    name: portfolio-commerce-network
    driver: bridge
